name: SEO Protection (read-only guard)
# Protects the SEO that already works: published URLs, slugs, titles, canonicals, indexability, structured data,
# robots.txt and the sitemap. Offline repo guard on every posts/** push, daily live drift check, and an
# append-only baseline. Never writes to WordPress.
on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'scripts/seo_common.py'
      - 'scripts/seo_audit.py'
      - 'scripts/seo_protection.py'
      - 'data/seo/protection-*.json'
      - 'tests/test_seo.py'
      - '.github/workflows/seo-protection.yml'
  schedule:
    - cron: '47 1 * * *'
  workflow_run:
    workflows: ['Excel Matrix WP Publisher']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = compare the live site with the baseline; baseline = add new pages / approve changes; repo = offline guard only'
        type: choice
        options: ['check', 'baseline', 'repo']
        default: 'check'
      accept:
        description: 'baseline mode: comma separated WordPress IDs whose CURRENT state is approved (needs reason)'
        type: string
        default: ''
      accept_site:
        description: 'baseline mode: approve the current robots.txt / sitemap / home state (needs reason)'
        type: boolean
        default: false
      reason:
        description: 'Why the change is approved (recorded in data/seo/protection-allowlist.json)'
        type: string
        default: ''
permissions:
  contents: write   # only the baseline commit uses it
  issues: write
concurrency:
  group: seo-protection
  cancel-in-progress: false
jobs:
  protect:
    # After the Publisher: only when it succeeded (new posts get baselined, existing entries are never rewritten).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SEO_USER_AGENT: ${{ vars.SEO_USER_AGENT }}   # optional repository variable if a WAF blocks the default bot name
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests for the SEO tools
        run: python -m unittest tests.test_seo
      - name: Repo guard (published sources, ledger, baseline invariants)
        id: repo
        continue-on-error: true
        run: python scripts/seo_protection.py --mode repo --out reports/seo/repo
      - name: Baseline new pages / approve intentional changes
        id: baseline
        if: ${{ github.event_name == 'workflow_run' || inputs.mode == 'baseline' }}
        env:
          ACCEPT: ${{ inputs.accept }}
          ACCEPT_SITE: ${{ inputs.accept_site }}
          REASON: ${{ inputs.reason }}
        shell: bash
        run: |
          args=(--mode baseline --out reports/seo/baseline)
          [[ -n "$ACCEPT" ]] && args+=(--accept "$ACCEPT")
          [[ "$ACCEPT_SITE" == 'true' ]] && args+=(--accept-site)
          [[ -n "$REASON" ]] && args+=(--reason "$REASON")
          python scripts/seo_protection.py "${args[@]}"
      - name: Commit the baseline (append-only)
        if: ${{ steps.baseline.conclusion == 'success' }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/seo/protection-baseline.json data/seo/protection-allowlist.json
          if git diff --cached --quiet; then echo 'Baseline unchanged'; exit 0; fi
          git commit -m 'chore(seo): update SEO protection baseline [skip ci]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          echo '::error::Could not push the baseline'; exit 1
      - name: Live drift check against the baseline
        id: check
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.mode == 'check' }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/seo_protection.py --mode check --out reports/seo/check
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [[ $code -eq 2 ]]; then
            echo '::warning::No SEO protection baseline yet. Run this workflow with mode=baseline once.'
            exit 0
          fi
          exit $code
      - name: Preserve the protection reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-protection-${{ github.run_id }}
          path: reports/seo/
          if-no-files-found: ignore
          retention-days: 30
      - name: Alert through one GitHub issue (opened on drift, closed when clean)
        if: ${{ always() && steps.check.outputs.code != '' && steps.check.outputs.code != '2' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.check.outputs.code }}
        shell: bash
        run: |
          title='SEO Protection alert'
          number="$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)"
          if [[ "$CODE" == '0' ]]; then
            [[ -n "$number" ]] && gh issue close "$number" --comment 'Latest live check is clean; closing.'
            exit 0
          fi
          body="$(head -c 60000 reports/seo/check/protection.md)"
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
      - name: Fail the run on a violation
        if: ${{ always() && (steps.repo.outcome == 'failure' || steps.check.outcome == 'failure' || steps.baseline.outcome == 'failure') }}
        run: |
          echo '::error::SEO protection found a violation or could not read the site; see the report artifact.'
          exit 1
