name: EN rollout (VI-EN Core REST)
# Operates the English side of the live WordPress through the VI-EN Core 0.5.1 REST API with the administrator
# application password of the publisher: one explicit action per run, dry run unless `live` is ticked, every write
# logged in the job summary and the artifact. `verify` and `status` never write.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do (rollout = status, routes on, categories, page pairs, verify in one pass; the EN autopilot runs it on a schedule)'
        type: choice
        options: ['status', 'verify', 'rollout', 'enable', 'disable', 'undo', 'register-categories', 'link-pages', 'publish-pages']
        default: 'status'
      live:
        description: 'Really write (enable/disable/undo/register/link/publish). Off = dry run.'
        type: boolean
        default: false
      confirm:
        description: 'enable on the production site: confirm that a fresh backup exists and the English pages were checked'
        type: boolean
        default: false
      ids:
        description: 'register-categories / publish-pages: IDs, comma separated, parents first'
        type: string
        default: ''
      pairs:
        description: 'link-pages: vi:en pairs, comma separated (e.g. 14:1759,19:1760,25:1761)'
        type: string
        default: ''
      urls:
        description: 'verify: public paths, comma separated'
        type: string
        default: '/en/,/en/about/,/en/prices/,/en/contact/,/en/rental-guide/,/en/faq/,/en/motorbikes/'
permissions:
  contents: read
concurrency:
  group: en-rollout
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEO_USER_AGENT: ${{ vars.SEO_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the action
        env:
          WP_USERNAME: ${{ secrets.WP_USERNAME || secrets.WP_USER }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
          ACTION: ${{ inputs.action }}
          LIVE: ${{ inputs.live }}
          CONFIRM: ${{ inputs.confirm }}
          IDS: ${{ inputs.ids }}
          PAIRS: ${{ inputs.pairs }}
          URLS: ${{ inputs.urls }}
        shell: bash
        run: |
          args=("$ACTION" --ids "$IDS" --pairs "$PAIRS" --urls "$URLS")
          [[ "$LIVE" == 'true' ]] && args+=(--live)
          [[ "$CONFIRM" == 'true' ]] && args+=(--confirm)
          python scripts/en_ops.py "${args[@]}"
      - name: Preserve the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: en-rollout-${{ github.run_id }}
          path: reports/en-rollout/
          if-no-files-found: ignore
          retention-days: 30
