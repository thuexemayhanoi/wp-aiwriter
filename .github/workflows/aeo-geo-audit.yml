name: AEO/GEO Audit (manual, read-only)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seo-engine-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  aeo:
    uses: ./.github/workflows/seo-engine.yml
    with:
      label: aeo-geo
      args: run --mode aeo-geo
