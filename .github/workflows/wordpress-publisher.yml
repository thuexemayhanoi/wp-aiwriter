name: Excel Matrix WP Publisher
on:
  # Automatically follow ONLY a successful push-triggered QA on main.
  workflow_run:
    workflows: ['WP AIWriter QA (No WordPress Writes)']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      live:
        description: 'Manual override: false = preview; true = live publish'
        required: true
        type: boolean
        default: false
      batch_size:
        description: 'Manual batch size per iteration (3 to 5)'
        required: true
        type: choice
        options: ['3', '4', '5']
        default: '3'
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: wp-aiwriter-publisher
  cancel-in-progress: false
jobs:
  qa-and-publish:
    # The QA workflow has no WP credentials. This secret-bearing job runs
    # automatically only after an approved main push and green QA.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout latest main inside the publication lock
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install small Markdown renderer
        run: python -m pip install -r requirements.txt
      - name: Test publisher safety regressions
        run: python -m unittest discover -s tests -v
      - name: Validate exact Excel source and all authored files
        id: qa
        run: python scripts/engine.py --mode qa
      - name: Configure checkpoint commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Immediately publish all eligible QA-ready posts in the active category
        id: sync
        env:
          WP_USERNAME: ${{ secrets.WP_USERNAME || secrets.WP_USER }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
          LIVE: ${{ github.event_name == 'workflow_run' && 'true' || inputs.live }}
          BATCH_SIZE: ${{ github.event_name == 'workflow_run' && '5' || inputs.batch_size }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$LIVE" != 'true' ]]; then
            echo "Manual dry run; zero WordPress writes"
            python scripts/engine.py --mode sync --limit "$BATCH_SIZE"
            exit 0
          fi
          # No interval or sleep: repeat up-to-5-post batches immediately.
          # Each iteration rechecks WordPress, duplicate titles, exact Excel
          # ancestry, category boundary and write-ahead publication receipts.
          for batch in $(seq 1 80); do
            echo "Auto publisher iteration $batch (max $BATCH_SIZE posts)"
            python scripts/engine.py --mode sync --limit "$BATCH_SIZE" --live --persist-state
            has_more="$(python -c "import json; print(str(json.load(open('reports/latest.json', encoding='utf-8'))['has_more']).lower())")"
            if [[ "$has_more" == 'false' ]]; then
              echo "All authored, QA-ready articles in this approved category are handled."
              exit 0
            fi
          done
          echo "::error::Safety limit 80 iterations reached; do not silently drop remaining ready articles."
          exit 1
      - name: Notify owner upon completed Excel category
        if: ${{ steps.sync.outputs.category_complete == 'true' && (github.event_name == 'workflow_run' || inputs.live) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FIRST_ID: ${{ steps.sync.outputs.category_first_id }}
          LAST_ID: ${{ steps.sync.outputs.category_last_id }}
        shell: bash
        run: |
          title="Excel SEO category finished #${FIRST_ID}-#${LAST_ID}"
          existing="$(gh issue list --repo "$REPO" --state all --limit 250 --json title --jq '.[].title')"
          if ! printf '%s\n' "$existing" | grep -Fxq "$title"; then
            gh issue create --repo "$REPO" --title "$title" --body-file reports/summary.md
          else
            echo "Category completion issue already exists; no duplicate notification."
          fi
      - name: Preserve publication receipts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-receipt-${{ github.run_id }}
          path: |
            reports/
            data/publication-state.json
          if-no-files-found: ignore
          retention-days: 30
