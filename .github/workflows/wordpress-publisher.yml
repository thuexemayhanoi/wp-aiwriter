name: Excel Matrix WP Publisher
on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'data/topics.json'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/wordpress-publisher.yml'
  workflow_dispatch:
    inputs:
      live:
        description: 'Actually create WordPress posts'
        required: true
        type: boolean
        default: true
      batch_size:
        description: 'Maximum attempted new articles in this run'
        required: true
        type: choice
        options: ['2', '1']
        default: '2'
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: wp-aiwriter-publisher
  cancel-in-progress: false
jobs:
  qa-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main inside the publication lock
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install small Markdown renderer
        run: python -m pip install -r requirements.txt
      - name: Test publisher safety regressions
        run: python -m unittest discover -s tests -v
      - name: Validate exact Excel source and all authored files
        id: qa
        continue-on-error: true
        run: python scripts/engine.py --mode qa
      - name: Configure checkpoint commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish and verify up to two articles
        id: sync
        env:
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
          LIVE: ${{ github.event.inputs.live }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
        shell: bash
        run: |
          if [[ "$LIVE" == 'false' ]]; then
            python scripts/engine.py --mode sync --limit "${BATCH_SIZE:-2}"
          else
            python scripts/engine.py --mode sync --limit "${BATCH_SIZE:-2}" --live --persist-state
          fi
      - name: Preserve publication receipts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-receipt-${{ github.run_id }}
          path: |
            reports/
            data/publication-state.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Continue with the next ready pair
        if: always() && steps.sync.outputs.has_more == 'true' && steps.sync.outputs.auth_ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wordpress-publisher.yml --ref main -f live=true -f batch_size=2
