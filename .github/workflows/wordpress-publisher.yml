name: Excel Matrix WP Publisher
on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Publish only after owner approval (false = preview)'
        required: true
        type: boolean
        default: false
      batch_size:
        description: 'Approved batch size (3 to 5 posts)'
        required: true
        type: choice
        options: ['3', '4', '5']
        default: '3'
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: wp-aiwriter-publisher
  cancel-in-progress: false
jobs:
  qa-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main inside the publication lock
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install small Markdown renderer
        run: python -m pip install -r requirements.txt
      - name: Test publisher safety regressions
        run: python -m unittest discover -s tests -v
      - name: Validate exact Excel source and all authored files
        id: qa
        run: python scripts/engine.py --mode qa
      - name: Configure checkpoint commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish owner-approved batch
        id: sync
        env:
          WP_USERNAME: ${{ secrets.WP_USERNAME || secrets.WP_USER }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
          LIVE: ${{ inputs.live }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        shell: bash
        run: |
          if [[ "$LIVE" == 'true' ]]; then
            python scripts/engine.py --mode sync --limit "$BATCH_SIZE" --live --persist-state
          else
            python scripts/engine.py --mode sync --limit "$BATCH_SIZE"
          fi
      - name: Notify owner upon completed Excel category
        if: ${{ inputs.live && steps.sync.outputs.category_complete == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FIRST_ID: ${{ steps.sync.outputs.category_first_id }}
          LAST_ID: ${{ steps.sync.outputs.category_last_id }}
        shell: bash
        run: |
          title="Excel SEO category finished #${FIRST_ID}-#${LAST_ID}"
          existing="$(gh issue list --repo "$REPO" --state all --limit 250 --json title --jq '.[].title')"
          if ! printf '%s\n' "$existing" | grep -Fxq "$title"; then
            gh issue create --repo "$REPO" --title "$title" --body-file reports/summary.md
          else
            echo "Category completion issue already exists; no duplicate notification."
          fi
      - name: Preserve publication receipts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-receipt-${{ github.run_id }}
          path: |
            reports/
            data/publication-state.json
          if-no-files-found: ignore
          retention-days: 30
