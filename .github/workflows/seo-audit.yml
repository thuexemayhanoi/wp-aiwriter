name: SEO Audit (read-only)
# Read-only: offline source audit on every posts/** push; live audit (public REST + public pages, no secrets
# required) weekly and on demand. Never writes to WordPress.
on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'scripts/seo_common.py'
      - 'scripts/seo_audit.py'
      - 'tests/test_seo.py'
      - '.github/workflows/seo-audit.yml'
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'source = repo only; live = public site only; full = both'
        type: choice
        options: ['full', 'live', 'source']
        default: 'full'
      max_pages:
        description: 'Limit live pages (0 = all)'
        type: string
        default: '0'
      check_links:
        description: 'HEAD-check internal links found on live pages'
        type: boolean
        default: true
      check_external:
        description: 'Also check external links (bot-blocking sites are ignored)'
        type: boolean
        default: false
      psi_sample:
        description: 'PageSpeed sample size (needs the optional PAGESPEED_API_KEY secret)'
        type: string
        default: '0'
permissions:
  contents: read
  issues: write
concurrency:
  group: seo-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SEO_USER_AGENT: ${{ vars.SEO_USER_AGENT }}   # optional repository variable if a WAF blocks the default bot name
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests for the SEO tools
        run: python -m unittest tests.test_seo
      - name: Run the SEO audit
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          MODE: ${{ inputs.mode || (github.event_name == 'schedule' && 'full' || 'source') }}
          MAX_PAGES: ${{ inputs.max_pages || '0' }}
          CHECK_LINKS: ${{ github.event_name == 'schedule' && 'true' || inputs.check_links }}
          CHECK_EXTERNAL: ${{ inputs.check_external }}
          PSI_SAMPLE: ${{ inputs.psi_sample || '0' }}
        shell: bash
        run: |
          args=(--mode "$MODE" --max-pages "$MAX_PAGES" --psi "$PSI_SAMPLE" --strict)
          [[ "$CHECK_LINKS" == 'true' ]] && args+=(--check-links)
          [[ "$CHECK_EXTERNAL" == 'true' ]] && args+=(--check-external)
          python scripts/seo_audit.py "${args[@]}"
      - name: Preserve the audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-${{ github.run_id }}
          path: reports/seo/
          if-no-files-found: ignore
          retention-days: 30
      - name: Keep one open issue with the latest report (scheduled and manual runs)
        if: ${{ always() && github.event_name != 'push' && hashFiles('reports/seo/audit.md') != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title='SEO Audit — latest report'
          body="$(head -c 60000 reports/seo/audit.md)"
          number="$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)"
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
